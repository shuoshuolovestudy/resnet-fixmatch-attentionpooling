{% extends 'base.html' %}
{% block content %}
<div class="card p-4">
    <h3 class="mb-4">🛡️ 系统全量识别监控面板</h3>
    <button type="submit" form="adminDeleteForm" class="btn btn-danger" onclick="return confirm('警告：确定要删除这些全系统记录吗？此操作不可撤销！')">
            🗑️ 批量删除选中记录
        </button>
    <form id="adminDeleteForm" action="{{ url_for('delete_records_admin') }}" method="POST">
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th style="width: 40px;">
                            <input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)">
                        </th>
                        <th>用户</th>
                        <th>图片预览</th>
                        <th>识别结果</th>
                        <th>时间</th>
                    </tr>
                </thead>
                <tbody>
                    {% for record in records %}
                    <tr>
                        <td>
                            <input type="checkbox" name="record_ids" value="{{ record.filename }}">
                        </td>
                        <td class="fw-bold">{{ record.user }}</td>
                        <td>
                            {% if record.filename %}
                            <a href="{{ url_for('static', filename='uploads/' + record.filename) }}" target="_blank">
                                <img src="{{ url_for('static', filename='uploads/' + record.filename) }}" width="60" height="60" style="object-fit: cover; border-radius: 4px;">
                            </a>
                            {% else %}
                            <span class="text-muted">无</span>
                            {% endif %}
                        </td>
                        <td><span class="text-danger fw-bold">{{ record.result }}</span></td>
                        <td class="text-muted">{{ record.time }}</td>
                    </tr>
                    {% else %}
                    <tr><td colspan="5" class="text-center">系统暂无识别记录</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </form>
</div>


<script>
function toggleSelectAll(source) {
    var checkboxes = document.getElementsByName('record_ids');
    for(var i=0, n=checkboxes.length; i<n; i++) {
        checkboxes[i].checked = source.checked;
    }
}
</script>

{% endblock %}
